services:
  triptrackbot:
    build: .
    container_name: triptrackbot
    restart: unless-stopped
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:172.18.0.1"
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - triptrack-net

networks:
  triptrack-net:
    name: triptrack-net